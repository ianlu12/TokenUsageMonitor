name: Build and Publish

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore TokenUsageMonitor.sln

      - name: Build
        run: dotnet build TokenUsageMonitor.sln -c Release --no-restore

      - name: Publish win-x64
        run: dotnet publish TokenUsageMonitor/ -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/win-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TokenUsageMonitor-win-x64
          path: publish/win-x64

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: TokenUsageMonitor-win-x64
          path: publish/win-x64

      - name: Zip artifact
        run: Compress-Archive -Path publish/win-x64/* -DestinationPath TokenUsageMonitor-win-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: TokenUsageMonitor-win-x64.zip
